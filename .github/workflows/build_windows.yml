name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtwebengine qtwebchannel qtpositioning'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Create Build Directory
      run: mkdir build

    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: cmake --build build --config Release

    - name: Deploy Qt Dependencies
      shell: bash
      run: |
        mkdir dist
        cp build/SweetBrowser.exe dist/
        cd dist
        windeployqt --release --compiler-runtime --no-translations --no-opengl-sw SweetBrowser.exe
        # Remove unneeded files if any
        rm -f *.obj *.ilk *.pdb

    - name: Archive Production Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SweetBrowser-Windows-x64
        path: dist/
